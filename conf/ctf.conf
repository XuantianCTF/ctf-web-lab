# ============================================================
#  示例站点虚拟主机（讲义第 2、5 章）
#  setup.sh 会把 __DOCROOT__ 替换为实际站点根目录
# ============================================================

<VirtualHost *:80>
    ServerName ctf.local
    ServerAlias www.ctf.local
    DocumentRoot __DOCROOT__

    # --------------------------------------------------------
    # 目录权限
    #   Indexes       -> 允许目录列表（信息泄露点，可改为 -Indexes）
    #   FollowSymLinks-> 允许符号链接
    #   AllowOverride -> All 才会读取 .htaccess（private/、uploads/ 依赖它）
    # --------------------------------------------------------
    <Directory __DOCROOT__>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --------------------------------------------------------
    # 上传目录：只允许读取，不允许列目录
    # （脚本解析在 uploads/.htaccess 中禁用）
    # --------------------------------------------------------
    <Directory __DOCROOT__/uploads>
        Options -Indexes
        AllowOverride All
    </Directory>

    # --------------------------------------------------------
    # 目录级访问控制示例（讲义第 5.7 节）
    # Require ip 判断 TCP 对端地址，不信任 X-Forwarded-For
    # --------------------------------------------------------
    <Directory __DOCROOT__/private>
        Require ip 127.0.0.1 ::1
    </Directory>

    # --------------------------------------------------------
    # Alias 示例（讲义第 5.4 节）
    #   /shared/x  ->  __DOCROOT__/files/x
    # 注意：Alias 不会自动继承 DocumentRoot 的 <Directory> 配置
    # --------------------------------------------------------
    Alias /shared __DOCROOT__/files

    DirectoryIndex index.php index.html

    # 响应头中的版本信息（讲信息泄露时可改为 Off）
    ServerSignature On

    ErrorLog  ${APACHE_LOG_DIR}/ctf_error.log
    CustomLog ${APACHE_LOG_DIR}/ctf_access.log combined
</VirtualHost>
